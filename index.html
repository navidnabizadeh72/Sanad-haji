<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اسناد</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#111;
font-family:tahoma;
color:white;
padding:20px;
}

h1{
text-align:center;
margin-bottom:25px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.photo{
position:relative;
overflow:hidden;
border-radius:12px;
}

.photo img{
width:100%;
display:block;
pointer-events:none;
user-select:none;
-webkit-user-drag:none;
}

.watermark{
position:absolute;
bottom:10px;
right:10px;
background:rgba(255,255,255,.35);
color:#000;
padding:4px 10px;
border-radius:6px;
font-size:12px;
font-weight:bold;
}

#viewer{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.95);
justify-content:center;
align-items:center;
z-index:9999;
}

#viewer img{
max-width:95%;
max-height:95%;
}
</style>
</head>
